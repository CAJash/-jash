<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Auth App</title>
  <style>
    /* Basic Layout Styles */
    body { font-family: sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .screen { display: none; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    .active { display: block; }
    input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    button:disabled { background: #ccc; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 20px; display: none; z-index: 1000; }
  </style>
</head>
<body>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <!-- Section 1: Login -->
  <div id="s1" class="screen active">
    <h2>Login</h2>
    <input type="email" id="login-email" placeholder="Email">
    <input type="password" id="login-pass" placeholder="Password">
    <button id="btn-signin" onclick="fbSignIn()">Sign In</button>
    <button onclick="fbGoogleLogin()" style="background:#db4437">Sign in with Google</button>
    <p>No account? <a href="#" onclick="go('s2')">Sign Up</a></p>
  </div>

  <!-- Section 2: Sign Up -->
  <div id="s2" class="screen">
    <h2>Create Account</h2>
    <input type="email" id="reg-email" placeholder="Email">
    <input type="password" id="reg-pass" placeholder="Password">
    <button id="btn-signup" onclick="fbSignUp()">Sign Up</button>
    <p>Already have an account? <a href="#" onclick="go('s1')">Login</a></p>
  </div>

  <!-- Section 4: Dashboard -->
  <div id="s4" class="screen">
    <h2>Welcome!</h2>
    <p id="user-display"></p>
    <button onclick="fbSignOut()" style="background:#6c757d">Sign Out</button>
  </div>

  <script>
    // Navigation Utility
    window.go = (id) => {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    };

    // Toast Utility
    window.toast = (msg, isError = false) => {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.background = isError ? '#dc3545' : '#333';
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3000);
    };

    // Loading Utility
    window.setLoading = (id, isLoading) => {
      const btn = document.getElementById(id);
      btn.disabled = isLoading;
      btn.innerText = isLoading ? 'Processing...' : (id === 'btn-signin' ? 'Sign In' : 'Sign Up');
    };
  </script>

  <script type="module">
    // Firebase Modular SDK Imports (Fixed Version)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      signInWithPopup, 
      GoogleAuthProvider, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    // Your Web App's Firebase Configuration
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // --- Auth State Observer ---
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('user-display').innerText = `Logged in as: ${user.email}`;
        go('s4');
      } else {
        go('s1');
      }
    });

    // --- Sign In Logic ---
    window.fbSignIn = async () => {
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-pass').value;
      if (!email || !pass) return toast('Fields cannot be empty', true);

      setLoading('btn-signin', true);
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        toast('Success!');
      } catch (e) {
        toast(e.message, true);
      } finally {
        setLoading('btn-signin', false);
      }
    };

    // --- Sign Up Logic ---
    window.fbSignUp = async () => {
      const email = document.getElementById('reg-email').value;
      const pass = document.getElementById('reg-pass').value;
      if (!email || !pass) return toast('Fields cannot be empty', true);

      setLoading('btn-signup', true);
      try {
        await createUserWithEmailAndPassword(auth, email, pass);
        toast('Account created!');
      } catch (e) {
        toast(e.message, true);
      } finally {
        setLoading('btn-signup', false);
      }
    };

    // --- Google Login ---
    window.fbGoogleLogin = async () => {
      try {
        await signInWithPopup(auth, provider);
        toast('Google Login Success!');
      } catch (e) {
        toast(e.message, true);
      }
    };

    // --- Sign Out ---
    window.fbSignOut = () => {
      signOut(auth).then(() => toast('Signed out'));
    };
  </script>
</body>
</html>
